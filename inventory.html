<!DOCTYPE html>
<html>
<!--
    LEGEND:
    HTML FILE: Structure of the page
    backendsystem.js: database + inventory functions
    inventory.js: connects the buttons on this page to the backend
-->
    <head>
        <title> Ationg's Fruit Shake - Inventory </title>
    </head>
    <body>
        <h1>Ationg's Fruit Shake Inventory System</h1>

        <div>
            <nav> <a href="landingp.html">Overview</a> </nav>
            <nav> <a href="inventory.html">Inventory</a> </nav>
            <button onclick="logout()">Log Out</button>
        </div>
        <br>

        <p id="message"></p>

        <!-- ADD ITEM -->
        <h2>Add Item</h2>
        <form onsubmit="handleAddItem(event)">
            <input type="text" id="itemName" placeholder="Item name (e.g. Mango)">
            <input type="text" id="itemCategory" placeholder="Category (Fruit, Milk, Ice...)">
            <input type="number" id="itemQuantity" placeholder="Quantity" min="0" step="any">
            <input type="text" id="itemUnit" placeholder="Unit (kg, pcs, L)">
            <input type="number" id="itemPrice" placeholder="Price per unit" min="0" step="any">
            <input type="number" id="itemReorder" placeholder="Low-stock level" min="0" step="any">
            <label>Expiry: <input type="date" id="itemExpiry"></label>
            <button type="submit">Add Item</button>
        </form>

        <!-- ALERTS -->
        <h2>Alerts</h2>
        <p><b>Low stock:</b> <span id="lowStockList"></span></p>
        <p><b>Expiring in 3 days (or expired):</b> <span id="expiringList"></span></p>

        <!-- INVENTORY TABLE -->
        <h2>Inventory</h2>
        <input type="text" id="searchBox" placeholder="Search name or category" oninput="renderInventory()">
        <button onclick="document.getElementById('searchBox').value=''; renderInventory()">Clear</button>
        <p id="totalValue"></p>

        <table border="1" cellpadding="4">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Qty</th>
                    <th>Unit</th>
                    <th>Price</th>
                    <th>Low-stock level</th>
                    <th>Expiry</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>

        <!-- ACTIVITY LOG -->
        <h2>Recent Activity</h2>
        <ul id="logList"></ul>

        <!-- BACKUP -->
        <h2>Backup</h2>
        <button onclick="handleExport()">Export Data</button>
        <input type="file" id="importFile" accept=".json" onchange="handleImport(event)">

        <script src="backendsystem.js"></script>
        <script src="inventory.js"></script>
    </body>
</html>
